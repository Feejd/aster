# Znak Aster zostaje na ekranie, dopóki nie pojawi się ekran logowania (zamiast czarnej przerwy):
# Plymouth kończy się z zachowaniem ostatniej klatki, a nie przed startem SDDM jak domyślnie.
[Unit]
Conflicts=plymouth-quit.service
After=plymouth-quit.service

[Service]
ExecStartPre=-/usr/bin/plymouth quit --retain-splash
