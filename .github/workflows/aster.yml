# Aster na GitHub Actions:
# - każda zmiana na main → obraz systemu (image/Containerfile) na x86_64 i ARM w ghcr.io/<konto>/aster:latest
#   (jeden adres dla obu, każdy komputer bierze swoją wersję) — z niego zainstalowane komputery biorą aktualizacje,
# - „Run workflow” z zaznaczonym ISO albo tag v* → także plik ISO z instalatorem (do pobrania w Artifacts):
#   aster-install-x86_64 (laptopy, PC) i aster-install-aarch64 (Mac z Apple Silicon w VMware Fusion / UTM).
name: Aster

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md", "prototype/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      iso:
        description: "Zbuduj też plik ISO z instalatorem"
        type: boolean
        default: true
      obraz:
        description: "Zbuduj obraz systemu od nowa (bez tego: gotowy obraz z ghcr.io — szybciej, gdy zmienia się tylko ISO)"
        type: boolean
        default: true
      arch:
        description: "Dla jakich procesorów"
        type: choice
        options: [oba, x86_64, aarch64]
        default: oba

permissions:
  contents: read
  packages: write

concurrency:
  group: aster-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      image: ${{ steps.m.outputs.image }}
    steps:
      - id: m
        run: |
          x86='{"arch":"x86_64","runner":"ubuntu-24.04","tag":"amd64"}'
          arm='{"arch":"aarch64","runner":"ubuntu-24.04-arm","tag":"arm64"}'
          case "${{ inputs.arch }}" in
            x86_64) list="[$x86]" ;;
            aarch64) list="[$arm]" ;;
            *) list="[$x86,$arm]" ;;
          esac
          echo "matrix={\"include\":$list}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/aster" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      IMAGE: ${{ needs.plan.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # Obraz systemu z ISO potrzebuje ok. 40 GB — tam, gdzie runner ma najwięcej miejsca, po zbędnych narzędziach
      - name: Miejsce na dysku
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/lib/jvm /usr/share/miniconda /opt/microsoft /opt/google /opt/az /usr/local/.ghcup /usr/local/julia* \
            /usr/lib/google-cloud-sdk /usr/local/lib/node_modules /usr/local/share/powershell /usr/local/share/chromium
          sudo swapoff -a && sudo rm -f /mnt/swapfile || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          root_free=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          mnt_free=$(df --output=avail -BG /mnt 2>/dev/null | tail -1 | tr -dc 0-9)
          if [ "${mnt_free:-0}" -gt "$root_free" ]; then base=/mnt; else base=/var/tmp/aster; fi
          sudo mkdir -p "$base/containers" "$base/iso"
          echo "BASE=$base" >> "$GITHUB_ENV"
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "%s/containers/storage"\n' "$base" | sudo tee /etc/containers/storage.conf
          df -h / /mnt 2>/dev/null || df -h /

      - name: Obraz systemu Aster
        if: github.event_name != 'workflow_dispatch' || inputs.obraz
        run: |
          sudo podman build -f image/Containerfile -t localhost/aster:latest .
          sudo podman image prune -f

      - name: Gotowy obraz systemu z ghcr.io
        if: github.event_name == 'workflow_dispatch' && !inputs.obraz
        run: |
          sudo podman pull "$IMAGE:latest-${{ matrix.tag }}"
          sudo podman tag "$IMAGE:latest-${{ matrix.tag }}" localhost/aster:latest

      - name: Wyślij obraz do ghcr.io
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.obraz)
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | sudo podman login ghcr.io -u '${{ github.actor }}' --password-stdin
          sudo podman push localhost/aster:latest "$IMAGE:latest-${{ matrix.tag }}"
          sudo podman push localhost/aster:latest "$IMAGE:${{ github.sha }}-${{ matrix.tag }}"

      - name: Narzędzia do ISO
        if: inputs.iso || startsWith(github.ref, 'refs/tags/')
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq skopeo squashfs-tools xorriso dosfstools mtools

      - name: ISO z instalatorem
        if: inputs.iso || startsWith(github.ref, 'refs/tags/')
        run: sudo env ASTER_PREBUILT=1 WORK="$BASE/iso" tools/build-iso.sh "$IMAGE:latest"

      - name: Pobierz ISO
        if: inputs.iso || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: aster-install-${{ matrix.arch }}
          path: ${{ env.BASE }}/iso/aster-install-${{ matrix.arch }}.iso
          compression-level: 0
          retention-days: 7

  # Jeden adres obrazu dla obu procesorów (aktualizacje: ghcr.io/<konto>/aster:latest)
  manifest:
    needs: [plan, build]
    if: github.event_name != 'pull_request' && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - run: |
          img='${{ needs.plan.outputs.image }}'
          echo '${{ secrets.GITHUB_TOKEN }}' | podman login ghcr.io -u '${{ github.actor }}' --password-stdin
          podman manifest create aster-latest
          for tag in amd64 arm64; do
              podman manifest add aster-latest "docker://$img:latest-$tag" 2>/dev/null || echo "Brak $tag — pomijam"
          done
          podman manifest push --all aster-latest "docker://$img:latest"
